name: Deploy

# Déploiement backend piloté par la branche = environnement :
#   push staging → env « staging »    (projet Supabase test)      — auto
#   push main    → env « production » (projet Supabase jibbl)     — APPROBATION requise
#
# Le frontend est déployé par Vercel (push → build). Ce workflow ne gère que la
# base (migrations via scripts/migrate.sh) et les edge functions.
#
# Secrets/variables PAR GitHub Environment (Settings → Environments) :
#   secret  DATABASE_URL           chaîne de connexion Postgres de l'env
#   secret  SUPABASE_ACCESS_TOKEN  jeton CLI Supabase (peut être partagé repo-level)
#   var     SUPABASE_PROJECT_REF   ref du projet Supabase de l'env
# L'env « production » doit avoir une règle « Required reviewers » (garde-fou prod).

on:
  push:
    branches: [staging, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # ne jamais couper un déploiement/migration en cours

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
      functions: ${{ steps.filter.outputs.functions }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            migrations:
              - 'supabase/migrations/**'
              - 'scripts/migrate.sh'
            functions:
              - 'supabase/functions/**'
              - 'scripts/deploy-edge-functions.sh'

  deploy:
    name: Migrate & deploy functions
    needs: changes
    # Rien à faire si ni migrations ni fonctions n'ont bougé (évite une approbation inutile).
    if: needs.changes.outputs.migrations == 'true' || needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply migrations
        if: needs.changes.outputs.migrations == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash scripts/migrate.sh

      - name: Deploy edge functions
        if: needs.changes.outputs.functions == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash scripts/deploy-edge-functions.sh "${{ vars.SUPABASE_PROJECT_REF }}"
