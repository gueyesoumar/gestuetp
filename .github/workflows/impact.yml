name: Analyse d'impact suggestion

# Phase 5a (code-facing, RFC 0010). Déclenché par l'Edge Function dispatch-impact
# (workflow_dispatch). Orchestre un map-reduce d'agents spécialisés qui lisent le
# code du dépôt (LECTURE SEULE) et produit un rapport d'impact, renvoyé à Supabase
# via feasibility-callback (kind='impact').
#
# Garde-fous : n'écrit JAMAIS dans le dépôt (contents: read) ; le texte de la
# suggestion est récupéré à l'exécution (hors inputs visibles) ; fan-out conditionnel
# via le cartographe ; modèle par étage (Haiku/Sonnet/Opus) ; coupe dure à 3 $.
# Secrets requis : ANTHROPIC_API_KEY, FEASIBILITY_CALLBACK_SECRET, SUPABASE_FUNCTIONS_URL.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'agent_runs.id (run impact à alimenter)'
        required: true

permissions:
  contents: read

concurrency:
  group: impact-${{ github.event.inputs.run_id }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyse d'impact (map-reduce)
    runs-on: ubuntu-latest
    # ref main → agents-production (jibbl), ref staging → agents-staging (snayz).
    environment:
      name: ${{ github.ref_name == 'main' && 'agents-production' || 'agents-staging' }}
    env:
      RUN_ID: ${{ github.event.inputs.run_id }}
      CB_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}/feasibility-callback
      CB_SECRET: ${{ secrets.FEASIBILITY_CALLBACK_SECRET }}
    steps:
      - name: Checkout (lecture seule)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code

      - name: Fetch suggestion
        run: |
          curl -sf -X POST "$CB_URL" \
            -H "x-callback-secret: $CB_SECRET" \
            -H 'Content-Type: application/json' \
            -d "{\"action\":\"fetch\",\"run_id\":\"$RUN_ID\"}" -o suggestion.json
          jq -r '.body // ""'   suggestion.json > body.txt
          jq -r '.module // "Général"' suggestion.json > module.txt
          test -s body.txt || { echo "Suggestion vide"; exit 1; }

      - name: Run impact (map-reduce)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          set -e
          MODULE="$(cat module.txt)"; SUG="$(cat body.txt)"
          total=0
          TOOLS="Read,Grep,Glob,Bash"

          add_cost() {  # $1 = envelope json (sortie --output-format json)
            c=$(jq -r '.total_cost_usd // 0' "$1" 2>/dev/null || echo 0)
            total=$(awk -v a="$total" -v b="$c" 'BEGIN{printf "%.4f", a+b}')
            echo "coût cumulé : $total \$"
            # Coupe dure à 3 $. NB: on renvoie 0 dans le cas normal (sinon `set -e` tue le script).
            if awk -v t="$total" 'BEGIN{exit !(t>3.0)}'; then echo "Budget 3\$ dépassé — arrêt"; exit 1; fi
            return 0
          }
          mkprompt() {  # $1 = fichier prompt du repo
            cp ".github/$1" p.txt
            printf '\n\nSUGGESTION À ANALYSER (module: %s) :\n---\n%s\n---\n' "$MODULE" "$SUG" >> p.txt
          }
          run_specialist_from_agent() {  # $1=agent md, $2=outfile, $3=axis
            { sed '1,/^---$/d' ".claude/agents/$1"; \
              printf '\n\nProduis EXCLUSIVEMENT le fichier %s via Bash (cat > %s). Aucun texte hors du JSON. Rédige les champs en français avec les accents (UTF-8), jamais en ASCII. Schéma : {"axis":"%s","verdict":"ok|attention|bloquant","findings":["..."],"note":"..."}.\n\nSUGGESTION (module: %s) :\n---\n%s\n---\n' "$2" "$2" "$3" "$MODULE" "$SUG"; } > p.txt
          }
          # Récupère le JSON produit : le fichier écrit par l'agent s'il existe et est valide,
          # sinon on l'extrait de la réponse de l'agent (.result de l'enveloppe --output-format json),
          # en retirant d'éventuelles clôtures ```… (les modèles légers répondent souvent inline).
          get_json() {  # $1 = enveloppe, $2 = fichier de sortie
            if [ -f "$2" ] && jq empty "$2" 2>/dev/null; then return 0; fi
            jq -r '.result // ""' "$1" 2>/dev/null | sed '/^```/d' > "$2"
            jq empty "$2" 2>/dev/null
          }

          # ① Cartographe (Haiku)
          mkprompt impact-prompt-cartographe.md
          claude -p "$(cat p.txt)" --model haiku --output-format json --permission-mode acceptEdits --allowedTools "$TOOLS" > env-carto.json || true
          add_cost env-carto.json
          get_json env-carto.json carto.json || { echo "carto.json manquant/invalide"; exit 1; }
          L_DATA=$(jq -r '.layers.data_rls // false' carto.json)
          L_SEC=$(jq -r '.layers.security // false' carto.json)
          L_FRONT=$(jq -r '.layers.frontend // false' carto.json)
          echo "couches → data_rls=$L_DATA security=$L_SEC frontend=$L_FRONT"

          # ② Données & RLS (Sonnet) — conditionnel
          if [ "$L_DATA" = "true" ]; then
            mkprompt impact-prompt-data-rls.md
            claude -p "$(cat p.txt)" --model sonnet --output-format json --permission-mode acceptEdits --allowedTools "$TOOLS" > env-data.json || true
            add_cost env-data.json
            get_json env-data.json spec-data.json || echo "spec-data indisponible (ignoré)"
          fi
          # ③ Sécurité serveur (Sonnet) — conditionnel, réutilise security-auditor
          if [ "$L_SEC" = "true" ]; then
            run_specialist_from_agent security-auditor.md spec-sec.json "Sécurité serveur"
            claude -p "$(cat p.txt)" --model sonnet --output-format json --permission-mode acceptEdits --allowedTools "$TOOLS" > env-sec.json || true
            add_cost env-sec.json
            get_json env-sec.json spec-sec.json || echo "spec-sec indisponible (ignoré)"
          fi
          # ④ Frontend & charte (Haiku) — conditionnel, réutilise code-reviewer
          if [ "$L_FRONT" = "true" ]; then
            run_specialist_from_agent code-reviewer.md spec-front.json "Frontend & charte"
            claude -p "$(cat p.txt)" --model haiku --output-format json --permission-mode acceptEdits --allowedTools "$TOOLS" > env-front.json || true
            add_cost env-front.json
            get_json env-front.json spec-front.json || echo "spec-front indisponible (ignoré)"
          fi
          # ⑤ Qualité & tests (Haiku) — toujours
          mkprompt impact-prompt-tests.md
          claude -p "$(cat p.txt)" --model haiku --output-format json --permission-mode acceptEdits --allowedTools "$TOOLS" > env-tests.json || true
          add_cost env-tests.json
          get_json env-tests.json spec-tests.json || echo "spec-tests indisponible (ignoré)"

          # ⑥ Synthétiseur (Opus)
          cp .github/impact-prompt-synthese.md p.txt
          printf '\n\nRAPPORTS SPÉCIALISTES :\n' >> p.txt
          for f in carto.json spec-data.json spec-sec.json spec-front.json spec-tests.json; do
            [ -f "$f" ] && { printf '\n=== %s ===\n' "$f" >> p.txt; cat "$f" >> p.txt; }
          done
          printf '\n\nSUGGESTION (module: %s) :\n---\n%s\n---\n' "$MODULE" "$SUG" >> p.txt
          claude -p "$(cat p.txt)" --model opus --output-format json --permission-mode acceptEdits --allowedTools "$TOOLS" > env-synth.json || true
          add_cost env-synth.json
          get_json env-synth.json report.json || { echo "report.json manquant/invalide"; exit 1; }

          jq empty report.json || { echo "report.json invalide"; exit 1; }
          jq -e '
            (.verdict|type=="string") and (.summary|type=="string") and
            (.blast_radius|type=="array") and (.tests|type=="array") and
            (.decoupage_lots|type=="array") and (.risks|type=="array") and
            (.specialists|type=="array")
          ' report.json > /dev/null || { echo "report.json hors schéma attendu"; exit 1; }
          echo "$total" > cost.txt

      - name: Write back report
        run: |
          COST=$(cat cost.txt 2>/dev/null || echo 0)
          jq -n --slurpfile r report.json --arg cost "$COST" \
            '{action:"writeback", run_id:env.RUN_ID, report:$r[0], usage:{cost_usd:($cost|tonumber)}}' > payload.json
          curl -sf -X POST "$CB_URL" \
            -H "x-callback-secret: $CB_SECRET" \
            -H 'Content-Type: application/json' \
            --data @payload.json

      - name: Mark error on failure
        if: failure()
        run: |
          curl -s -X POST "$CB_URL" \
            -H "x-callback-secret: $CB_SECRET" \
            -H 'Content-Type: application/json' \
            -d "{\"action\":\"writeback\",\"run_id\":\"$RUN_ID\"}" || true
